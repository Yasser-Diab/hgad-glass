apply plugin: 'com.android.application'

def ydReleaseStoreFile = System.getenv("YD_RELEASE_STORE_FILE") ?: project.findProperty("YD_RELEASE_STORE_FILE")
def ydReleaseStorePassword = System.getenv("YD_RELEASE_STORE_PASSWORD") ?: project.findProperty("YD_RELEASE_STORE_PASSWORD")
def ydReleaseKeyAlias = System.getenv("YD_RELEASE_KEY_ALIAS") ?: project.findProperty("YD_RELEASE_KEY_ALIAS")
def ydReleaseKeyPassword = System.getenv("YD_RELEASE_KEY_PASSWORD") ?: project.findProperty("YD_RELEASE_KEY_PASSWORD")
def ydReleaseSigningReady = [ydReleaseStoreFile, ydReleaseStorePassword, ydReleaseKeyAlias, ydReleaseKeyPassword].every { it }
def ydReleaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }

if (ydReleaseTaskRequested && !ydReleaseSigningReady) {
    throw new GradleException("Release signing is not configured. Set YD_RELEASE_STORE_FILE, YD_RELEASE_STORE_PASSWORD, YD_RELEASE_KEY_ALIAS, and YD_RELEASE_KEY_PASSWORD outside Git.")
}

android {
    namespace "com.hgad.glassorders"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hgad.glassorders"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "0.1.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions "mode"
    productFlavors {
        full {
            dimension "mode"
            manifestPlaceholders = [
                appName: "Y.D Glass Manager",
                activityTitle: "Y.D Glass Manager"
            ]
            buildConfigField "String", "APP_VARIANT", "\"full\""
        }
        status {
            dimension "mode"
            applicationIdSuffix ".status"
            manifestPlaceholders = [
                appName: "Y.D Glass Manager - Order Status",
                activityTitle: "Y.D Glass Manager - Order Status"
            ]
            buildConfigField "String", "APP_VARIANT", "\"status\""
        }
    }
    signingConfigs {
        release {
            if (ydReleaseSigningReady) {
                storeFile file(ydReleaseStoreFile)
                storePassword ydReleaseStorePassword
                keyAlias ydReleaseKeyAlias
                keyPassword ydReleaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
